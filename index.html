<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhyoung An | Researcher</title>
    <meta name="description" content="Minhyoung An — NAIST researcher working on on-device contextual inference, human activity recognition, and privacy-aware sensing.">
    <meta name="theme-color" content="#f7f8fa">
    <link rel="canonical" href="https://amh0727.github.io/">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!--
      THESIS: A concise researcher index that makes research focus, verified profiles, publications, and BibTeX immediately accessible.
      OWN-WORLD: Institutional cool-white field, near-black type, cobalt links, thin rules, dense bibliography, no cards or decorative imagery.
      STORY: Identity and education → verified destinations → short research focus → ACM interests → publications and awards.
      FIRST VIEWPORT: Slim utility header, compact name/education/focus, research interests, and the beginning of the publication index.
      FORM: Experience direction, seed fa8f7abc, approved Composition C with concise-copy constraint.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <header class="site-header">
        <a class="site-identity" href="#about" id="site-name">Minhyoung An</a>
        <nav class="header-nav" aria-label="Primary navigation">
            <a href="#publications" data-nav="navPublications">論文・発表</a>
            <a href="#awards" data-nav="navAwards">受賞歴</a>
        </nav>
        <div class="header-tools">
            <div class="profile-links" id="profile-links" aria-label="External profiles"></div>
            <div class="lang-switch" id="lang-switch" role="group" aria-label="Language">
                <button type="button" data-lang="en">EN</button>
                <button type="button" data-lang="ja">日本語</button>
                <button type="button" data-lang="ko">한국어</button>
            </div>
        </div>
    </header>

    <div class="page-shell">
        <section class="intro" id="about" aria-labelledby="hero-name">
            <p class="hero-greeting" id="hero-greeting"></p>
            <div class="identity-line">
                <h1 class="hero-name" id="hero-name"></h1>
                <p class="hero-subtitle">
                    <span id="hero-affiliation"></span><span class="subtitle-separator" aria-hidden="true"> · </span><span id="hero-program"></span>
                </p>
            </div>
            <p class="hero-description" id="hero-description"></p>
            <div class="research-row">
                <p class="interests-label" data-i18n="researchInterests">Research interests</p>
                <div class="hero-interests" id="hero-interests"></div>
            </div>
        </section>

        <div class="content-grid">
            <main class="content">
                <section class="section" id="publications">
                    <div class="section-header">
                        <h2 data-i18n="secPublications">主な論文・発表</h2>
                        <div class="pub-stats" id="pub-stats"></div>
                    </div>
                    <div class="pub-filters" id="pub-filters" aria-label="Publication year filter"></div>
                    <div class="pub-list" id="pub-list"></div>
                </section>

                <section class="section compact-section" id="awards">
                    <div class="section-header">
                        <h2 data-i18n="secAwards">受賞歴</h2>
                    </div>
                    <div class="award-list" id="award-list"></div>
                </section>
            </main>

            <aside class="contents-rail" aria-label="On this page">
                <nav class="side-nav">
                    <a href="#publications"><span data-nav="navPublications">論文・発表</span></a>
                    <a href="#awards"><span data-nav="navAwards">受賞歴</span></a>
                </nav>
            </aside>
        </div>

        <footer class="footer">
            <p>&copy; <span id="footer-year"></span> <span id="footer-name"></span></p>
        </footer>
    </div>

    <script src="i18n/ja.js"></script>
    <script src="i18n/en.js"></script>
    <script src="i18n/ko.js"></script>
    <script src="data.js"></script>
    <script src="render.js"></script>
</body>

</html>
