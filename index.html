<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhyoung An | Researcher Portfolio</title>
    <meta name="description" content="Minhyoung An – NAIST修士課程。オンデバイス推論・プライバシー保護型HAR研究者のポートフォリオ。">
    <link rel="canonical" href="https://amh0727.github.io/">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Set theme before paint to avoid flash -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("theme");
                var dark = saved ? saved === "dark"
                    : window.matchMedia("(prefers-color-scheme: dark)").matches;
                if (dark) document.documentElement.setAttribute("data-theme", "dark");
            } catch (e) { }
        })();
    </script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!-- Top-right controls: language switch + theme toggle -->
    <div class="top-controls">
        <div class="lang-switch" id="lang-switch" role="group" aria-label="Language">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="ja">日本語</button>
            <button type="button" data-lang="ko">한국어</button>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="テーマ切り替え" title="ライト / ダーク切替">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4" />
            </svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
        </button>
    </div>

    <div class="layout">
        <!-- ===== Sticky Sidebar : 自己紹介 (always visible) ===== -->
        <aside class="sidebar" id="about">
            <div class="sidebar-inner">
                <div class="profile-head">
                    <div class="hero-avatar">
                        <span id="hero-initials">MA</span>
                    </div>
                    <div>
                        <p class="hero-greeting" id="hero-greeting"></p>
                        <h1 class="hero-name" id="hero-name"></h1>
                    </div>
                </div>

                <p class="hero-subtitle">
                    <span class="highlight" id="hero-affiliation"></span> <span id="hero-program"></span>
                </p>
                <p class="hero-description" id="hero-description"></p>
                <div class="hero-interests" id="hero-interests"></div>

                <div class="profile-links" id="profile-links"></div>

                <nav class="side-nav">
                    <a href="#education"><span class="side-nav-num">01</span> <span data-nav="navEducation">学歴</span></a>
                    <a href="#publications"><span class="side-nav-num">02</span> <span data-nav="navPublications">論文・発表</span></a>
                    <a href="#awards"><span class="side-nav-num">03</span> <span data-nav="navAwards">受賞歴</span></a>
                </nav>
            </div>
        </aside>

        <!-- ===== Scrollable Main Content ===== -->
        <main class="content">
            <!-- Education Section -->
            <section class="section" id="education">
                <div class="section-header">
                    <span class="section-label">01</span>
                    <h2 data-i18n="secEducation">学歴</h2>
                </div>
                <div class="edu-list" id="edu-list"></div>
            </section>

            <!-- Publications Section -->
            <section class="section" id="publications">
                <div class="section-header">
                    <span class="section-label">02</span>
                    <h2 data-i18n="secPublications">主な論文・発表</h2>
                </div>

                <!-- Stats -->
                <div class="pub-stats" id="pub-stats"></div>

                <!-- Year filter -->
                <div class="pub-filters" id="pub-filters"></div>

                <!-- Publication list (rendered from data.js) -->
                <div class="pub-list" id="pub-list"></div>
            </section>

            <!-- Awards Section -->
            <section class="section" id="awards">
                <div class="section-header">
                    <span class="section-label">03</span>
                    <h2 data-i18n="secAwards">受賞歴</h2>
                </div>
                <div class="award-list" id="award-list"></div>
            </section>

            <!-- Footer -->
            <footer class="footer">
                <p>&copy; <span id="footer-year"></span> <span id="footer-name"></span>. All rights reserved.</p>
            </footer>
        </main>
    </div>

    <!-- Language files (i18n) -->
    <script src="i18n/ja.js"></script>
    <script src="i18n/en.js"></script>
    <script src="i18n/ko.js"></script>
    <!-- Data (DB) + render logic -->
    <script src="data.js"></script>
    <script src="render.js"></script>
</body>

</html>
